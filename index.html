<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matriz de Bloqueos — Loma Negra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- PANTALLA: ETAPAS -->
  <div id="screen-etapas" class="screen active">
    <div class="header header-default">
      <div class="logo-circle">
        <img src="LN__LOMA_NEGRA_FULL.png" alt="Loma Negra" />
      </div>
      <div class="header-text">
        <h1>Matriz de bloqueos</h1>
        <p>Seleccioná una etapa para continuar</p>
      </div>
    </div>
    <div class="content">
      <p class="section-title">Etapas de proceso</p>
      <div class="stage-grid" id="etapas-grid"></div>
    </div>
  </div>

  <!-- PANTALLA: EQUIPOS -->
  <div id="screen-equipos" class="screen">
    <div class="header" id="equipos-header">
      <div class="nav-left">
        <button class="back-btn" onclick="goTo('etapas')">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
          Etapas
        </button>
      </div>
      <div class="header-text center">
        <h1 id="equipos-etapa-title">—</h1>
        <p id="equipos-etapa-sub">Seleccioná un equipo</p>
      </div>
      <div class="nav-right"></div>
    </div>
    <div class="content">
      <p class="section-title">Equipos</p>
      <div class="equipo-list" id="equipos-list"></div>
    </div>
  </div>

  <!-- PANTALLA: DETALLE -->
  <div id="screen-detalle" class="screen">
    <div class="header" id="detalle-header">
      <div class="nav-left">
        <button class="back-btn" id="back-to-equipos-btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
          <span id="back-etapa-label">Equipos</span>
        </button>
      </div>
      <div class="header-text center">
        <h1 id="detalle-title">—</h1>
        <p>Equipos a bloquear</p>
      </div>
      <div class="nav-right">
        <button class="back-btn home-btn" onclick="goTo('etapas')">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
          Etapas
        </button>
      </div>
    </div>
    <div class="content" id="detalle-content"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
